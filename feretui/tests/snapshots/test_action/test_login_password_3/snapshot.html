<form hx-post="/feretui/action/login_password" hx-swap="outerHTML" hx-trigger="submit">
 <div class="container" style="max-width: 500px; margin: 2rem auto;">
  
  <div>
   <div aria-description="">
 
 <label aria-description="" for="login">
  Login
      
  <small aria-hidden="true">
   (required)
  </small>
  
  <span aria-hidden="true">
   
  </span>
 </label>
 
      <input autocomplete="username" class="input is-danger " id="login" name="login" required type="text" value="">
      
 <small id="invalid-helper">
  This field is required.
 </small>
 
</div>
          <div aria-description="">
 
 <label aria-description="" for="password">
  Password
      
  <small aria-hidden="true">
   (required)
  </small>
  
  <span aria-hidden="true">
   
  </span>
 </label>
 
      <input autocomplete="current-password" class="input is-danger " id="password" name="password" required type="password" value="">
      
 <small id="invalid-helper">
  This field is required.
 </small>
 
</div>
   <div class="buttons">
    <button class="button is-primary is-fullwidth" type="submit">
     Log in
    </button>
   </div>
  </div>
 </div>
</form>
